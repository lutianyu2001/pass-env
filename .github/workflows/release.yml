# Release: on a version tag, runs CI, checks that the tag's source archive reports the tag's version, builds the conda
# package, publishes it to the prefix.dev channel by trusted publishing (no stored token), then creates the GitHub
# release with the package attached, and checks GitHub's own source archive of the tag. By hand, the same commands:
# `git archive`, `pixi exec rattler-build build`, `rattler-build upload prefix`, `gh release create`.
name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

env:
  CHANNEL: tianyulu/main                  # Per project: the prefix.dev channel, as its canonical reference
  RATTLER_BUILD: rattler-build==0.80.0

jobs:
  # Whether the tag is a pre-release. A conda version cannot hold a "-", and the tag's version is the
  # package's, so here a pre-release's tag is written without one: v1.2.0rc1, the label (a, b, rc,
  # alpha, beta, pre, preview or dev) straight after the number, with or without a number of its
  # own. The form other projects use (v1.2.0-rc.1) counts as a pre-release too, so that it never
  # reaches the channel, and build then refuses it. A pre-release is built as a release is and gets a GitHub pre-release with its files,
  # to download and try: it goes to no registry or package repository, and starts no other workflow.
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - id: kind
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if printf '%s\n' "$TAG" | grep -Eq -- '(-|[0-9])(a|b|rc|alpha|beta|pre|preview|dev)\.?[0-9]*$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci: # zizmor: ignore[self-repository] actionlint 1.7.12 rejects GitHub's $/ form
    uses: ./.github/workflows/ci.yml

  build:
    needs: [kind, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                  # git archive fills the version from git describe, which needs the tags
          persist-credentials: false
      - name: The tag's source archive reports the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir "$RUNNER_TEMP/archive"
          git archive "$TAG" | tar -x -C "$RUNNER_TEMP/archive"
          got=$("$RUNNER_TEMP/archive/bin/pass-env" version)
          if [ "$got" != "pass-env ${TAG#v}" ]; then echo "::error::the archive says '$got', not 'pass-env ${TAG#v}'"; exit 1; fi
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.79.0
          run-install: false
      - name: Build the conda package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) echo "::error::a conda version cannot hold a '-': tag a pre-release as v1.2.0rc1, not $TAG"; exit 1 ;;
          esac
          PASS_ENV_VERSION=${TAG#v} pixi exec -s "$RATTLER_BUILD" rattler-build build \
            --recipe packaging/conda/recipe.yaml --output-dir "$RUNNER_TEMP/out"
          mkdir dist
          cp "$RUNNER_TEMP"/out/noarch/pass-env-*.conda dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  prefix-dev:
    needs: [kind, build]
    # Not for a pre-release, nor the jobs that wait for this one.
    if: needs.kind.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prefix-dev
    permissions:
      contents: read
      id-token: write                     # trusted publishing to prefix.dev
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.79.0
          run-install: false
      - name: Upload to prefix.dev
        run: pixi exec -s "$RATTLER_BUILD" rattler-build upload prefix --channel "$CHANNEL" dist/pass-env-*.conda

  github-release:
    needs: [kind, prefix-dev]
    # Also when the jobs before it were skipped for a pre-release; never after one that failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.kind.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --generate-notes --prerelease="$PRERELEASE" dist/pass-env-*.conda

  source-archive:
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: GitHub's source archive of the tag reports the tag's version
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          curl -fsSL "https://github.com/$REPO/archive/refs/tags/$TAG.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          got=$("$RUNNER_TEMP/${REPO#*/}-${TAG#v}/bin/pass-env" version)
          if [ "$got" != "pass-env ${TAG#v}" ]; then echo "::error::GitHub's archive says '$got', not 'pass-env ${TAG#v}'"; exit 1; fi
